name: Encrypted transfer probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download encrypted generic asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/encrypted-probe"
          gh release download runtime-transfer-probe-20261124 --repo rukawaping75-crypto/android-emulator-ci-smoke-20261124 --pattern draft-probe.txt.gpg --dir "$RUNNER_TEMP/encrypted-probe"
      - name: Decrypt and verify generic asset
        env:
          TRANSPORT_KEY: ${{ secrets.NBA_RUNTIME_TRANSPORT_KEY }}
        run: |
          set -euo pipefail
          test -n "$TRANSPORT_KEY"
          printf '%s' "$TRANSPORT_KEY" > "$RUNNER_TEMP/encrypted-probe/passphrase"
          chmod 600 "$RUNNER_TEMP/encrypted-probe/passphrase"
          gpg --quiet --batch --yes --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/encrypted-probe/passphrase" --decrypt --output "$RUNNER_TEMP/encrypted-probe/draft-probe.txt" "$RUNNER_TEMP/encrypted-probe/draft-probe.txt.gpg"
          test "$(sha256sum "$RUNNER_TEMP/encrypted-probe/draft-probe.txt" | cut -d' ' -f1)" = "7193580bb779b5936de83916cca293df60092d3f71eaff64be91eef8d59c57ad"
          echo ENCRYPTED_TRANSFER_OK
