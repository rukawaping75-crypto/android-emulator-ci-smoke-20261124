name: Android read-only runtime check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download and verify encrypted payload
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSPORT_KEY: ${{ secrets.NBA_RUNTIME_TRANSPORT_KEY }}
        run: |
          set -euo pipefail
          test -n "$TRANSPORT_KEY"
          mkdir -p "$RUNNER_TEMP/nba-payload"
          gh release download runtime-caller-payload-20261124 --repo rukawaping75-crypto/android-emulator-ci-smoke-20261124 --pattern caller-payload-20261124.bin.gpg --dir "$RUNNER_TEMP/nba-payload"
          test "$(sha256sum "$RUNNER_TEMP/nba-payload/caller-payload-20261124.bin.gpg" | cut -d' ' -f1)" = "763fcebe3b4a52b2cecede3569310c79125bc0619082b9ed9c501f9fbefad94e"
          printf '%s' "$TRANSPORT_KEY" > "$RUNNER_TEMP/nba-passphrase"
          chmod 600 "$RUNNER_TEMP/nba-passphrase"
          gpg --quiet --batch --yes --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/nba-passphrase" --decrypt --output "$RUNNER_TEMP/nba-payload/payload.tar" "$RUNNER_TEMP/nba-payload/caller-payload-20261124.bin.gpg"
          test "$(sha256sum "$RUNNER_TEMP/nba-payload/payload.tar" | cut -d' ' -f1)" = "5d8b79f7dc67aa2e6ecd1d1dd0bf14871136f380fbbaef36112a6cd275878c0"
          tar -xf "$RUNNER_TEMP/nba-payload/payload.tar" -C "$RUNNER_TEMP/nba-payload"
          test -f "$RUNNER_TEMP/nba-payload/probe.sh"
          test -f "$RUNNER_TEMP/nba-payload/caller.sh"
          echo ENCRYPTED_PAYLOAD_VERIFIED
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator and run bounded check
        env:
          NBA_TRANSPORT_PASS_FILE: ${{ runner.temp }}/nba-passphrase
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          script: |
            set -eu
            bash "$RUNNER_TEMP/nba-payload/probe.sh"
            echo NBA_RUNTIME_PERMISSIONS_BEGIN
            adb shell dumpsys package com.nbaimd.gametime.nba2011 | grep -E 'android.permission.(CAMERA|ACCESS_FINE_LOCATION|RECORD_AUDIO): granted=' || true
            echo NBA_RUNTIME_PERMISSIONS_END
            bash "$RUNNER_TEMP/nba-payload/caller.sh"
