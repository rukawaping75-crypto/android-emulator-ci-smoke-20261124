name: Android read-only runtime check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download and verify encrypted payload
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSPORT_KEY: ${{ secrets.NBA_RUNTIME_TRANSPORT_KEY }}
        run: |
          set -euo pipefail
          test -n "$TRANSPORT_KEY"
          mkdir -p "$RUNNER_TEMP/nba-payload"
          gh release download runtime-payload-20261124 --repo rukawaping75-crypto/android-emulator-ci-smoke-20261124 --pattern payload-20261124.bin.gpg --dir "$RUNNER_TEMP/nba-payload"
          test "$(sha256sum "$RUNNER_TEMP/nba-payload/payload-20261124.bin.gpg" | cut -d' ' -f1)" = "b8dd6e240a002939e5d318899597c0529688702677f4142d0c90522d8d9e05d9"
          printf '%s' "$TRANSPORT_KEY" > "$RUNNER_TEMP/nba-passphrase"
          chmod 600 "$RUNNER_TEMP/nba-passphrase"
          gpg --quiet --batch --yes --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/nba-passphrase" --decrypt --output "$RUNNER_TEMP/nba-payload/payload.tar" "$RUNNER_TEMP/nba-payload/payload-20261124.bin.gpg"
          test "$(sha256sum "$RUNNER_TEMP/nba-payload/payload.tar" | cut -d' ' -f1)" = "e92f9d3bdc5bc71172013f8ec2300f009c41d024269608ab14bda18876286504"
          tar -xf "$RUNNER_TEMP/nba-payload/payload.tar" -C "$RUNNER_TEMP/nba-payload"
          test -f "$RUNNER_TEMP/nba-payload/probe.sh"
          echo ENCRYPTED_PAYLOAD_VERIFIED
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator and run bounded check
        env:
          NBA_TRANSPORT_PASS_FILE: ${{ runner.temp }}/nba-passphrase
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          script: |
            set -eu
            bash "$RUNNER_TEMP/nba-payload/probe.sh"
