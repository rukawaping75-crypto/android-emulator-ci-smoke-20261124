name: Android bridge read-only check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download and verify encrypted payload
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSPORT_KEY: ${{ secrets.NBA_RUNTIME_TRANSPORT_KEY }}
        run: |
          set -euo pipefail
          test -n "$TRANSPORT_KEY"
          mkdir -p "$RUNNER_TEMP/nba-payload"
          gh release download runtime-readonly-probe-20261124 --repo rukawaping75-crypto/android-emulator-ci-smoke-20261124 --pattern bridge-probe-20261124.bin.gpg --dir "$RUNNER_TEMP/nba-payload"
          test "$(sha256sum "$RUNNER_TEMP/nba-payload/bridge-probe-20261124.bin.gpg" | cut -d' ' -f1)" = "7cdfa621426d1989c04c5a888a2476754d3d68109e2e13a301d5bb4cfe845f3f"
          printf '%s' "$TRANSPORT_KEY" > "$RUNNER_TEMP/nba-passphrase"
          chmod 600 "$RUNNER_TEMP/nba-passphrase"
          gpg --quiet --batch --yes --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/nba-passphrase" --decrypt --output "$RUNNER_TEMP/nba-payload/payload.tar" "$RUNNER_TEMP/nba-payload/bridge-probe-20261124.bin.gpg"
          test "$(sha256sum "$RUNNER_TEMP/nba-payload/payload.tar" | cut -d' ' -f1)" = "0a63649c4397cccc20fe0b095dc38b0262cab3ee2bcde1709ae01dc127e526dd"
          tar -xf "$RUNNER_TEMP/nba-payload/payload.tar" -C "$RUNNER_TEMP/nba-payload"
          test -f "$RUNNER_TEMP/nba-payload/bridge-probe.sh"
          echo BRIDGE_PAYLOAD_VERIFIED
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator and run bounded read-only check
        env:
          NBA_TRANSPORT_PASS_FILE: ${{ runner.temp }}/nba-passphrase
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          script: bash "$RUNNER_TEMP/nba-payload/bridge-probe.sh"
