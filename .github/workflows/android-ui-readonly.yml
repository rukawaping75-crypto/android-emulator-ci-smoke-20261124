name: Android UI read-only check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download and verify encrypted payload
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSPORT_KEY: ${{ secrets.NBA_RUNTIME_TRANSPORT_KEY }}
        run: |
          set -euo pipefail
          test -n "$TRANSPORT_KEY"
          mkdir -p "$RUNNER_TEMP/nba-payload"
          gh release download runtime-ui-probe-20261124 --repo rukawaping75-crypto/android-emulator-ci-smoke-20261124 --pattern nba-root-ui-readonly.bin.gpg --dir "$RUNNER_TEMP/nba-payload"
          test "$(sha256sum "$RUNNER_TEMP/nba-payload/nba-root-ui-readonly.bin.gpg" | cut -d' ' -f1)" = "5722c3fbb680b388d2b6048c26e1eef040b78ef1407d298e67e1c631d149f07c"
          printf '%s' "$TRANSPORT_KEY" > "$RUNNER_TEMP/nba-passphrase"
          chmod 600 "$RUNNER_TEMP/nba-passphrase"
          gpg --quiet --batch --yes --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/nba-passphrase" --decrypt --output "$RUNNER_TEMP/nba-payload/payload.tar" "$RUNNER_TEMP/nba-payload/nba-root-ui-readonly.bin.gpg"
          test "$(sha256sum "$RUNNER_TEMP/nba-payload/payload.tar" | cut -d' ' -f1)" = "5d2d24b403bbef7ec24395afeddea317de0f3e4afb40696ec2fd560aa3f55e3f"
          tar -xf "$RUNNER_TEMP/nba-payload/payload.tar" -C "$RUNNER_TEMP/nba-payload"
          test -f "$RUNNER_TEMP/nba-payload/nba-root-ui-readonly.sh"
          echo UI_PAYLOAD_VERIFIED
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator and run bounded read-only check
        env:
          NBA_TRANSPORT_PASS_FILE: ${{ runner.temp }}/nba-passphrase
          NBA_ACTOR_A_PASSWORD: ${{ secrets.NBA_ACTOR_A_PASSWORD }}
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          script: |
            set -eu
            bash "$RUNNER_TEMP/nba-payload/nba-root-ui-readonly.sh"
            adb shell input tap 540 1965
            sleep 25
            adb exec-out screencap -p > "$RUNNER_TEMP/nba-root-ui-readonly/after-decline.png"
            test -s "$RUNNER_TEMP/nba-root-ui-readonly/after-decline.png"
            gpg --quiet --batch --yes --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/nba-passphrase" --symmetric --cipher-algo AES256 --s2k-digest-algo SHA256 --output "$RUNNER_TEMP/nba-root-ui-readonly/after-decline.png.gpg" "$RUNNER_TEMP/nba-root-ui-readonly/after-decline.png"
            echo UI_AFTER_DECLINE_GPG_BASE64_BEGIN
            base64 -w 76 "$RUNNER_TEMP/nba-root-ui-readonly/after-decline.png.gpg"
            echo UI_AFTER_DECLINE_GPG_BASE64_END
            echo UI_AFTER_DECLINE_CAPTURE_COMPLETE
            adb shell input tap 775 2010
            sleep 18
            adb exec-out screencap -p > "$RUNNER_TEMP/nba-root-ui-readonly/sign-in.png"
            test -s "$RUNNER_TEMP/nba-root-ui-readonly/sign-in.png"
            gpg --quiet --batch --yes --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/nba-passphrase" --symmetric --cipher-algo AES256 --s2k-digest-algo SHA256 --output "$RUNNER_TEMP/nba-root-ui-readonly/sign-in.png.gpg" "$RUNNER_TEMP/nba-root-ui-readonly/sign-in.png"
            echo UI_SIGN_IN_GPG_BASE64_BEGIN
            base64 -w 76 "$RUNNER_TEMP/nba-root-ui-readonly/sign-in.png.gpg"
            echo UI_SIGN_IN_GPG_BASE64_END
            echo UI_SIGN_IN_CAPTURE_COMPLETE
            adb shell input tap 350 1110
            adb shell input text 'lobshsu0111+nba-a@wearehackerone.com'
            adb shell input keyevent 4
            adb shell input tap 540 1320
            sleep 18
            adb exec-out screencap -p > "$RUNNER_TEMP/nba-root-ui-readonly/email-next.png"
            test -s "$RUNNER_TEMP/nba-root-ui-readonly/email-next.png"
            gpg --quiet --batch --yes --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/nba-passphrase" --symmetric --cipher-algo AES256 --s2k-digest-algo SHA256 --output "$RUNNER_TEMP/nba-root-ui-readonly/email-next.png.gpg" "$RUNNER_TEMP/nba-root-ui-readonly/email-next.png"
            echo UI_EMAIL_NEXT_GPG_BASE64_BEGIN
            base64 -w 76 "$RUNNER_TEMP/nba-root-ui-readonly/email-next.png.gpg"
            echo UI_EMAIL_NEXT_GPG_BASE64_END
            echo UI_EMAIL_NEXT_CAPTURE_COMPLETE
            test -n "$NBA_ACTOR_A_PASSWORD"
            adb shell input tap 350 1110
            adb shell input text "$NBA_ACTOR_A_PASSWORD"
            adb shell input keyevent 4
            adb shell input tap 540 1390
            sleep 22
            adb exec-out screencap -p > "$RUNNER_TEMP/nba-root-ui-readonly/actor-a-login.png"
            test -s "$RUNNER_TEMP/nba-root-ui-readonly/actor-a-login.png"
            gpg --quiet --batch --yes --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/nba-passphrase" --symmetric --cipher-algo AES256 --s2k-digest-algo SHA256 --output "$RUNNER_TEMP/nba-root-ui-readonly/actor-a-login.png.gpg" "$RUNNER_TEMP/nba-root-ui-readonly/actor-a-login.png"
            echo UI_ACTOR_A_LOGIN_GPG_BASE64_BEGIN
            base64 -w 76 "$RUNNER_TEMP/nba-root-ui-readonly/actor-a-login.png.gpg"
            echo UI_ACTOR_A_LOGIN_GPG_BASE64_END
            echo UI_ACTOR_A_LOGIN_CAPTURE_COMPLETE
